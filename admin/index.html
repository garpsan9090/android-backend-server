<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upward Investments Admin Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Admin Portal</h1>
      <p>Manage users and review account details for the Android app.</p>
    </header>

    <main id="app-content" class="app-content"></main>
  </div>

  <script>
    // If this admin page is opened from a local file, default to the deployed backend URL.
    // If the page is served from the backend itself, same-origin relative API paths are used.
    (function() {
      const params = new URLSearchParams(window.location.search);
      const apiBaseUrl = params.get('apiBaseUrl') || '';
      if (apiBaseUrl) {
        window.__ADMIN_API_BASE_URL = apiBaseUrl.trim();
      } else if (window.location.protocol === 'file:' && !window.__ADMIN_API_BASE_URL) {
        window.__ADMIN_API_BASE_URL = 'https://upward-investments-backend-server.onrender.com';
      }
    })();
  </script>
  <script src="admin.js"></script>
</body>
</html>
